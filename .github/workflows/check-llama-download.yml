name: Check llama.cpp Download

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executes every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'

jobs:
  test-download:
    name: Test Download on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Prevents the job from failing immediately if one of the matrix jobs fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26' # GO-Version

    - name: Run Download Test
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs the test for the llama.cpp download URL
      run: go test -v -run TestLlamaDownloadURL
